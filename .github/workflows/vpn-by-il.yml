name: VPN by IL build

# Builds VPN by IL (a fork of Hiddify) for Android / Android TV and Windows,
# then publishes the files as a GitHub release. Releases are made only by this
# workflow, as the Hiddify license requires.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IS_GITHUB_ACTIONS: 1
  CHANNEL: prod
  FLUTTER_VERSION: '3.38.5'
  APP_FILE_PREFIX: VPN-by-IL

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install build tools
        run: |
          make android-apk-install-deps
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      # Optional: a stable signing key lets new versions install over old ones.
      # Without these secrets the APK is signed with a throwaway debug key.
      - name: Android signing key (if configured)
        env:
          KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::ANDROID_SIGNING_KEY is not set: the APK gets a debug signature, so an update must be installed after removing the old version."
            exit 0
          fi
          echo "$KEY" | base64 --decode > android/key.jks
          {
            echo "storeFile=$(pwd)/android/key.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties

      - name: Prepare
        run: make android-apk-prepare

      - name: Build APK
        run: make android-apk-release

      - name: Collect files
        run: |
          mkdir -p out
          ls -R build/app/outputs/flutter-apk || true
          cp build/app/outputs/flutter-apk/*arm64-v8a*.apk   "out/${APP_FILE_PREFIX}-Android-arm64.apk"    || echo "no arm64 apk"
          cp build/app/outputs/flutter-apk/*armeabi-v7a*.apk "out/${APP_FILE_PREFIX}-Android-arm7.apk"     || echo "no arm7 apk"
          cp build/app/outputs/flutter-apk/app-release.apk   "out/${APP_FILE_PREFIX}-Android-universal.apk" || echo "no universal apk"
          ls -la out
          test -n "$(ls out)"

      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: out/*
          retention-days: 30

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install build tools
        shell: pwsh
        run: |
          make windows-install-deps
          "$env:LOCALAPPDATA\Pub\Cache\bin" >> $env:GITHUB_PATH
          "$HOME\.pub-cache\bin" >> $env:GITHUB_PATH

      - name: Prepare
        run: make windows-prepare

      # Unsigned build: WINDOWS_SIGN_BACKEND is not set, so no signing hook runs.
      - name: Build portable zip
        run: make windows-zip-release

      - name: Build installer
        run: make windows-exe-release

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out -Force | Out-Null
          Get-ChildItem -Path dist -Recurse -File | Select-Object FullName
          $zip = Get-ChildItem -Path dist -Recurse -File -Filter *.zip | Select-Object -First 1
          $exe = Get-ChildItem -Path dist -Recurse -File -Filter *.exe | Select-Object -First 1
          if ($zip) { Copy-Item $zip.FullName "out\$env:APP_FILE_PREFIX-Windows-Portable-x64.zip" }
          if ($exe) { Copy-Item $exe.FullName "out\$env:APP_FILE_PREFIX-Windows-Setup-x64.exe" }
          Get-ChildItem out
          if (-not (Get-ChildItem out)) { throw 'No Windows files were built' }

      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: out/*
          retention-days: 30

  release:
    needs: [android, windows]
    if: always() && (needs.android.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: files
          merge-multiple: true

      - name: Version
        id: v
        run: echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: VPN by IL — сборка ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Сборка VPN by IL из коммита ${{ github.sha }}.

            **Windows:** `VPN-by-IL-Windows-Setup-x64.exe` — установщик, `VPN-by-IL-Windows-Portable-x64.zip` — без установки.
            **Android и Android TV:** `VPN-by-IL-Android-universal.apk` подходит для любого устройства; `arm64` — для современных телефонов, `arm7` — для старых телевизоров и приставок.

            Приложение основано на [Hiddify](https://github.com/hiddify/hiddify-app) и распространяется под той же лицензией.
          files: files/*
