name: VPN by IL - Amnezia theme

on:
  workflow_dispatch:
  push:
    branches: [codex/vpn-by-il-amnezia]

permissions:
  contents: read

concurrency:
  group: vpn-by-il-amnezia-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      QT_VERSION: '6.10.1'
      QIF_VERSION: '4.7'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 10
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install Conan
        run: python -m pip install conan==2.28.0
      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtremoteobjects qt5compat qtshadertools qthttpserver qtwebsockets
          tools: tools_ifw
          dir: ${{ runner.temp }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build Windows installer
        shell: cmd
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
        run: deploy\build.bat --installer ifw
      - uses: actions/upload-artifact@v4
        with:
          name: Amnezia-VPN-by-IL-Windows-x64
          path: deploy/build/AmneziaVPN_*_windows_x64.exe
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            qt_arch: android_arm64_v8a
          - abi: armeabi-v7a
            qt_arch: android_armv7
    env:
      QT_VERSION: '6.10.3'
      QT_MODULES: qtremoteobjects qt5compat qtimageformats qtshadertools
      APP_ANDROID_MIN_SDK: '28'
      NDK_VERSION: '27.0.11718014'
      ANDROID_NDK_VERSION: '27.0.11718014'
      JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 10
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libegl1
          python -m pip install conan==2.28.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-28 platforms;android-36 build-tools;36.0.0 ndk;27.0.11718014'
      - name: Install host Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}
      - name: Install Android Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: ${{ matrix.qt_arch }}
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}
      - name: Prepare APK signing
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: |
          signing_path="$RUNNER_TEMP/vpn-by-il.keystore"
          if [ -n "$SIGNING_KEY" ]; then
            test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS"
            if [ "$KEY_PASSWORD" != "$STORE_PASSWORD" ]; then
              echo '::error::This upstream build requires matching store and key passwords.'
              exit 1
            fi
            printf '%s' "$SIGNING_KEY" | base64 --decode > "$signing_path"
          else
            echo '::warning::Test signature only: configure signing secrets before distributing updates.'
            STORE_PASSWORD=android
            KEY_ALIAS=androiddebugkey
            keytool -genkeypair -keystore "$signing_path" -storepass android -keypass android -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 365 -dname 'CN=Android Debug,O=Android,C=US'
          fi
          {
            printf 'QT_ANDROID_KEYSTORE_PATH=%s\n' "$signing_path"
            printf 'QT_ANDROID_KEYSTORE_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'QT_ANDROID_KEYSTORE_STORE_PASS=%s\n' "$STORE_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build Android and Android TV APK
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
          ABI: ${{ matrix.abi }}
        run: deploy/build.sh -t android --sign --abi "$ABI"
      - uses: actions/upload-artifact@v4
        with:
          name: Amnezia-VPN-by-IL-Android-TV-${{ matrix.abi }}
          path: deploy/build/client/android-build/AmneziaVPN.apk
          if-no-files-found: error
          retention-days: 14
